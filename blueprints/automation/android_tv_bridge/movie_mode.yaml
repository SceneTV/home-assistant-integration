blueprint:
  name: SceneTV movie mode
  description: >-
    Dim the lights when something starts playing on a SceneTV TV, bring them
    up a little on pause, and put them back the way they were when playback
    stops.
  domain: automation
  source_url: https://github.com/SceneTV/home-assistant-integration/blob/main/blueprints/automation/android_tv_bridge/movie_mode.yaml
  input:
    tv:
      name: TV
      selector:
        device:
          integration: android_tv_bridge
    lights:
      name: Lights
      selector:
        entity:
          domain: light
          multiple: true
    playing_brightness:
      name: Brightness while playing
      description: 0 turns the lights off.
      default: 0
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    paused_brightness:
      name: Brightness while paused
      default: 30
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    transition:
      name: Transition
      default: 2
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: s
    apps:
      name: Only for these apps (optional)
      description: >-
        App package names, such as com.plexapp.android. Leave empty for every
        app.
      default: []
      selector:
        text:
          multiple: true
    only_after_sunset:
      name: Only after sunset
      default: false
      selector:
        boolean:

mode: restart
max_exceeded: silent

variables:
  apps: !input apps
  only_after_sunset: !input only_after_sunset
  playing_brightness: !input playing_brightness
  paused_brightness: !input paused_brightness
  transition: !input transition
  lights: !input lights
  scene_id: "scenetv_movie_mode_{{ this.entity_id | replace('.', '_') }}"

triggers:
  - trigger: device
    domain: android_tv_bridge
    device_id: !input tv
    type: playback_started
    id: started
  - trigger: device
    domain: android_tv_bridge
    device_id: !input tv
    type: playback_paused
    id: paused
  - trigger: device
    domain: android_tv_bridge
    device_id: !input tv
    type: playback_stopped
    id: stopped

conditions:
  - condition: template
    value_template: >-
      {% set data = trigger.event.data %}
      {% set pkg = (data.media or {}).package or data.package %}
      {{ apps | length == 0 or pkg in apps }}
  - condition: template
    value_template: >-
      {{ not only_after_sunset or is_state('sun.sun', 'below_horizon') }}

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: started
        sequence:
          - if:
              - condition: template
                value_template: "{{ states('scene.' ~ scene_id) in ['unknown', 'unavailable'] }}"
            then:
              - action: scene.create
                data:
                  scene_id: "{{ scene_id }}"
                  snapshot_entities: "{{ lights }}"
          - if:
              - condition: template
                value_template: "{{ playing_brightness | int == 0 }}"
            then:
              - action: light.turn_off
                target:
                  entity_id: "{{ lights }}"
                data:
                  transition: "{{ transition }}"
            else:
              - action: light.turn_on
                target:
                  entity_id: "{{ lights }}"
                data:
                  brightness_pct: "{{ playing_brightness }}"
                  transition: "{{ transition }}"
      - conditions:
          - condition: trigger
            id: paused
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ lights }}"
            data:
              brightness_pct: "{{ paused_brightness }}"
              transition: "{{ transition }}"
      - conditions:
          - condition: trigger
            id: stopped
        sequence:
          - if:
              - condition: template
                value_template: "{{ states('scene.' ~ scene_id) not in ['unknown', 'unavailable'] }}"
            then:
              - action: scene.turn_on
                target:
                  entity_id: "scene.{{ scene_id }}"
                data:
                  transition: "{{ transition }}"
              - action: scene.delete
                target:
                  entity_id: "scene.{{ scene_id }}"
