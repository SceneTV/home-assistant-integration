create_deep_link_shortcut:
  name: Create deep-link shortcut
  description: Add a deep-link shortcut tile to the active SceneTV launcher profile.
  fields:
    entry_id:
      selector:
        text:
    device_id:
      selector:
        device:
          integration: android_tv_bridge
    title:
      required: true
      description: Shortcut title shown on SceneTV.
      example: YouTube Subscriptions
      selector:
        text:
    subtitle:
      description: Optional secondary label.
      example: YouTube
      selector:
        text:
    intent_uri:
      description: Android intent URI. Required when URI is not provided.
      example: intent://www.youtube.com/feed/subscriptions#Intent;scheme=https;package=com.google.android.youtube.tv;end
      selector:
        text:
          multiline: true
    uri:
      description: Standard URI/deep link. Required when intent URI is not provided.
      example: https://www.youtube.com/feed/subscriptions
      selector:
        text:
    package:
      description: Optional Android package to associate with the shortcut.
      example: com.google.android.youtube.tv
      selector:
        text:
    image_uri:
      description: Optional image URI for the shortcut tile.
      selector:
        text:
    image_url:
      description: Optional image URL for the shortcut tile.
      selector:
        text:
    launch_mode:
      default: open
      description: Choose whether SceneTV just opens the shortcut or returns home when playback completes.
      selector:
        select:
          options:
            - label: Open
              value: open
            - label: Play then exit
              value: play_then_exit
    enabled:
      default: true
      selector:
        boolean:
    timeout_ms:
      selector:
        number:
          min: 1000
          max: 60000
          mode: box

send_key:
  name: Send key
  description: Send a supported remote-control key event to SceneTV.
  fields:
    entry_id:
      selector:
        text:
    device_id:
      selector:
        device:
          integration: android_tv_bridge
    key:
      name: Key
      description: D-pad key to send. D-pad aliases are accepted.
      required: true
      example: DPAD_CENTER
      selector:
        select:
          mode: dropdown
          options:
            - DPAD_UP
            - DPAD_DOWN
            - DPAD_LEFT
            - DPAD_RIGHT
            - DPAD_CENTER
            - UP
            - DOWN
            - LEFT
            - RIGHT
            - CENTER
            - SELECT
            - OK
            - ENTER
    timeout_ms:
      selector:
        number:
          min: 1000
          max: 60000
          mode: box

media_command:
  fields:
    entry_id:
      selector:
        text:
    device_id:
      selector:
        device:
          integration: android_tv_bridge
    command:
      required: true
      selector:
        select:
          options:
            - play
            - pause
            - play_pause
            - stop
            - next
            - previous
            - rewind
            - fast_forward
    timeout_ms:
      selector:
        number:
          min: 1000
          max: 60000
          mode: box

show_popup:
  name: Show popup
  description: Show a text notification popup on SceneTV.
  fields:
    entry_id:
      selector:
        text:
    device_id:
      selector:
        device:
          integration: android_tv_bridge
    title:
      description: Optional popup title.
      selector:
        text:
    text:
      description: Popup body text. Required unless a title is provided.
      selector:
        text:
          multiline: true
    position:
      default: top-right
      selector:
        select:
          options:
            - top-left
            - top-right
            - bottom-left
            - bottom-right
            - center
    font_size:
      default: medium
      selector:
        select:
          options:
            - small
            - medium
            - large
            - max
    color:
      default: grey
      selector:
        select:
          options:
            - grey
            - black
            - indigo
            - green
            - red
            - cyan
            - teal
            - amber
            - pink
    transparency:
      default: 25%
      selector:
        select:
          options:
            - 0%
            - 25%
            - 50%
            - 75%
            - 100%
    interrupt:
      selector:
        boolean:
    icon_url:
      selector:
        text:
    icon_base64:
      selector:
        text:
          multiline: true
    duration_ms:
      selector:
        number:
          min: 1000
          max: 600000
          mode: box
    timeout_ms:
      selector:
        number:
          min: 1000
          max: 60000
          mode: box

