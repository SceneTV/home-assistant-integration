send_key:
  name: Send key
  description: Send a supported remote-control key event to SceneTV.
  fields:
    entry_id:
      selector:
        text:
    device_id:
      selector:
        device:
          integration: android_tv_bridge
    key:
      name: Key
      description: D-pad key to send. D-pad aliases are accepted.
      required: true
      example: DPAD_CENTER
      selector:
        select:
          mode: dropdown
          options:
            - DPAD_UP
            - DPAD_DOWN
            - DPAD_LEFT
            - DPAD_RIGHT
            - DPAD_CENTER
            - UP
            - DOWN
            - LEFT
            - RIGHT
            - CENTER
            - SELECT
            - OK
            - ENTER
    timeout_ms:
      selector:
        number:
          min: 1000
          max: 60000
          mode: box

media_command:
  fields:
    entry_id:
      selector:
        text:
    device_id:
      selector:
        device:
          integration: android_tv_bridge
    command:
      required: true
      selector:
        select:
          options:
            - play
            - pause
            - play_pause
            - stop
            - next
            - previous
            - seek
    seek_position_ms:
      selector:
        number:
          min: 0
          max: 86400000
          mode: box
    timeout_ms:
      selector:
        number:
          min: 1000
          max: 60000
          mode: box

