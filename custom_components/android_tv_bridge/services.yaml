show_popup:
  name: Show popup
  description: Show a text notification popup on SceneTV.
  target:
    entity:
      integration: android_tv_bridge
  fields:
    entry_id:
      selector:
        text:
    title:
      description: Optional popup title.
      selector:
        text:
    text:
      description: Popup body text. Required unless a title or HTML is provided.
      selector:
        text:
          multiline: true
    position:
      default: top-right
      selector:
        select:
          options:
            - top-left
            - top-right
            - bottom-left
            - bottom-right
            - center
    font_size:
      default: medium
      selector:
        select:
          options:
            - small
            - medium
            - large
            - max
    color:
      default: grey
      selector:
        select:
          options:
            - grey
            - black
            - indigo
            - green
            - red
            - cyan
            - teal
            - amber
            - pink
    transparency:
      default: 25%
      selector:
        select:
          options:
            - 0%
            - 25%
            - 50%
            - 75%
            - 100%
    interrupt:
      selector:
        boolean:
    icon_url:
      selector:
        text:
    icon_base64:
      selector:
        text:
          multiline: true
    actions:
      name: Buttons
      description: >-
        Up to 3 buttons, each {id, label, style, default, data}. style is default,
        primary or destructive. A Dismiss button is always added and gets focus unless
        one action sets default to true. A press fires android_tv_bridge.popup_action
        with action_id, popup_id and data. Buttons make the popup take remote focus,
        and duration_ms defaults to 30000.
      example: >-
        [{"id": "unlock", "label": "Unlock", "style": "destructive"},
        {"id": "snooze", "label": "Snooze 10 min"}]
      selector:
        object:
    popup_id:
      name: Popup ID
      description: >-
        Optional id echoed in popup_shown, popup_action and popup_dismissed events.
        Generated when left out; use response_variable to read it.
      selector:
        text:
    dismiss_label:
      name: Dismiss label
      description: Label of the built-in Dismiss button when buttons are set. Defaults to Dismiss.
      selector:
        text:
    html:
      name: HTML
      description: >-
        Optional HTML body with CSS and JavaScript, drawn inside the popup so it shows
        over any app, with the same position, buttons and timeout. Enough on its own
        (title and text become optional). A full page (doctype or html tag) loads as is.
      example: "<style>b{color:#4da3ff}</style><b>Doorbell</b>"
      selector:
        text:
          multiline: true
    allow_javascript:
      name: Allow JavaScript
      description: Let the HTML run scripts. Defaults to on. Separate from Interactive.
      default: true
      selector:
        boolean:
    interactive:
      name: Interactive
      description: >-
        The HTML takes remote focus (OK goes to the page, Back still closes). Pages
        can send actions back with SceneTV.postAction (android_tv_bridge.web_action).
      selector:
        boolean:
    width_dp:
      description: Width of the HTML area in dp (default 420).
      selector:
        number:
          min: 120
          max: 2000
          mode: box
    height_dp:
      description: Height of the HTML area in dp (default 240).
      selector:
        number:
          min: 120
          max: 2000
          mode: box
    duration_ms:
      selector:
        number:
          min: 1000
          max: 600000
          mode: box
    timeout_ms:
      selector:
        number:
          min: 1000
          max: 60000
          mode: box

