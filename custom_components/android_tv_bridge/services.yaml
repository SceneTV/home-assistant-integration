send_key:
  name: Send key
  description: Send a supported remote-control key event to SceneTV.
  target:
    entity:
      integration: android_tv_bridge
  fields:
    entry_id:
      selector:
        text:
    key:
      name: Key
      description: D-pad key to send. D-pad aliases are accepted.
      required: true
      example: DPAD_CENTER
      selector:
        select:
          mode: dropdown
          options:
            - DPAD_UP
            - DPAD_DOWN
            - DPAD_LEFT
            - DPAD_RIGHT
            - DPAD_CENTER
            - UP
            - DOWN
            - LEFT
            - RIGHT
            - CENTER
            - SELECT
            - OK
            - ENTER
    timeout_ms:
      selector:
        number:
          min: 1000
          max: 60000
          mode: box

